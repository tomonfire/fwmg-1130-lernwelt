name: Claude Code

# Reagiert auf „@claude“ in Issues, Issue-/PR-Kommentaren und Reviews.
# Nur Personen mit Schreibrechten im Repository können Claude auslösen (Standard der Action).
# Einrichtung: Claude-GitHub-App installieren und Secret CLAUDE_CODE_OAUTH_TOKEN
# (oder ANTHROPIC_API_KEY) anlegen, siehe docs/REPOSITORY.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Claude Code ausführen
        uses: anthropics/claude-code-action@v1
        with:
          # Eines der beiden Secrets genügt: Abo-Token (claude setup-token) oder API-Schlüssel.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude darf die eigenen Änderungen prüfen, aber keine anderen Befehle ausführen.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(npm ci),Bash(npm run check),Bash(npm run csp:update)"
