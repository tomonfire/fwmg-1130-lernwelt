name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Dateien und Regeln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dateien, Manifest, Impressum, noindex, keine fremden Server, JavaScript-Syntax
        run: npm run check

  browser:
    name: Browser-Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Startseite, Trainer, Offline-Betrieb
        run: npm run test:browser
